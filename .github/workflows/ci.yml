name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.100
      - run: dotnet restore Age.slnx
      - run: dotnet build Age.slnx --no-restore -c Release
      - run: dotnet test --project Age.Tests/Age.Tests.csproj --no-build -c Release
      - run: dotnet run --project Age.Content.Lint/Age.Content.Lint.csproj -c Release --no-build -- Resources Prototypes
      - run: dotnet format Age.slnx --verify-no-changes
