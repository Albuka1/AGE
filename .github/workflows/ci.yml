name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  # Every job below only reads the repository. Asking for that once, at the top, means a job cannot quietly use the wider
  # default permissions of the workflow token.
  contents: read
jobs:
  # Every job below stands on its own: it checks the repository out, restores and builds what it needs, and waits for no
  # other job. That is what makes a job that failed re-runnable on its own from the Actions page, instead of running the
  # whole list again and hoping the same thing fails: "Re-run failed jobs" re-runs exactly the jobs that are red.
  #
  # The price is a restore and a build per job, which is a few seconds each. Get it back by keeping a job to one question:
  # the build job answers "does everything compile", the test job runs the tests, one lint job reads each pass of the content
  # — the prototypes, the sheets and the locales — and the format job checks the style. A pass of the content that is wrong
  # is a red job of its own, so a person reads which part of the content to look at without opening the log.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The tree is built and tested and never pushed to, so the token of the checkout does not have to stay in the git
          # configuration of the runner.
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.100
      - run: dotnet restore Age.slnx
      - run: dotnet build Age.slnx --no-restore -c Release

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.100
      - run: dotnet restore Age.Tests/Age.Tests.csproj
      - run: dotnet build Age.Tests/Age.Tests.csproj --no-restore -c Release
      - run: dotnet test --project Age.Tests/Age.Tests.csproj --no-build -c Release

  lint-prototypes:
    name: Content lint (prototypes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.100
      - run: dotnet restore Age.Content.Lint/Age.Content.Lint.csproj
      - run: dotnet build Age.Content.Lint/Age.Content.Lint.csproj --no-restore -c Release
      # The linter reads the pass it is named and reports under it, so each pass is a job of its own: a failure names the part of the
      # content that is wrong, and only that job restarts from the Actions page.
      - run: dotnet run --project Age.Content.Lint/Age.Content.Lint.csproj -c Release --no-build -- Resources Prototypes Textures Prototypes

  lint-sheets:
    name: Content lint (sheets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.100
      - run: dotnet restore Age.Content.Lint/Age.Content.Lint.csproj
      - run: dotnet build Age.Content.Lint/Age.Content.Lint.csproj --no-restore -c Release
      - run: dotnet run --project Age.Content.Lint/Age.Content.Lint.csproj -c Release --no-build -- Resources Prototypes Textures Sheets

  lint-locales:
    name: Content lint (locales)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.100
      - run: dotnet restore Age.Content.Lint/Age.Content.Lint.csproj
      - run: dotnet build Age.Content.Lint/Age.Content.Lint.csproj --no-restore -c Release
      - run: dotnet run --project Age.Content.Lint/Age.Content.Lint.csproj -c Release --no-build -- Resources Prototypes Textures Locales

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.100
      - run: dotnet restore Age.slnx
      - run: dotnet format Age.slnx --verify-no-changes --no-restore
