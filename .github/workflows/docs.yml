name: Docs
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'index.md'
      - 'toc.yml'
      - 'docfx.json'
      - 'tools/docfx/**'
      - 'QUICKSTART.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'Age.*/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.100
      # The reference is read from the XML documentation of the assemblies, so the build of the
      # solution is what the site is generated from: a type that has no doc comment is a type that
      # is missing from the site, which is the one thing that keeps the two in step.
      - run: dotnet build Age.slnx -c Release
      - run: dotnet tool install -g docfx
      - run: docfx docfx.json

      # docfx writes the page of a table of contents as `toc.html`, so the folder a person types — `/api/` — would have no
      # document to serve and GitHub Pages would answer 404. The page is copied to the name a folder is served by, which is
      # what makes the address of the reference the address of its folder.
      - run: cp _site/api/toc.html _site/api/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
