name: Bug Report
description: Report a bug in AGE
title: "[Bug]: "
labels: ["T: Bug", "S: Needs Triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in every
        field below so the report can be reproduced.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The minimal, deterministic sequence that triggers the bug.
      placeholder: |
        1. Create a world and add ...
        2. Call ...
        3. Observe ...
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AGE version
      description: The release tag, package version or commit SHA you are running.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: dotnet
    attributes:
      label: .NET version
      description: The output of `dotnet --version`.
      placeholder: 10.0.103
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 24.04, macOS 15
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and stack traces
      description: Paste any relevant output. It is rendered as code, no backticks needed.
      render: shell
    validations:
      required: false
